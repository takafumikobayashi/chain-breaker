<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 38 38">
  <!-- Same mark as the header logo (.brand-mark): rounded tile with three bars. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#171d2a"/>
      <stop offset="1" stop-color="#0d111a"/>
    </linearGradient>
  </defs>
  <rect x="0.5" y="0.5" width="37" height="37" rx="10.5" fill="url(#tile)" stroke="#b1c1e4" stroke-opacity="0.2"/>
  <rect x="10" y="13" width="4" height="12" rx="2" fill="#f25767" fill-opacity="0.75"/>
  <rect x="17" y="9" width="4" height="20" rx="2" fill="#8097ff"/>
  <rect x="24" y="11.5" width="4" height="15" rx="2" fill="#60d8f2"/>
</svg>
